version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: library_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database_libraries
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: 
      context: ./my-library-api-node
    container_name: library_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql-db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=database_libraries
      - PORT=5000
    depends_on:
      - mysql-db

  user-web:
    build:
      context: ./my-library-user-web
    container_name: library_user_web
    restart: always
    ports:
      - "5174:80"
    depends_on:
      - api

  admin-web:
    build:
      context: ./my-library-admin-web
    container_name: library_admin_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  db_data:
